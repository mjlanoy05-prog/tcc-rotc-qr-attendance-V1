<!DOCTYPE html>
<html>

<head>
    <title>TCC ROTC Attendance</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

    <h1>TCC ROTC UNIT</h1>
    <h2>QR ATTENDANCE</h2>

    <label><b>Select Attendance Day</b></label>

    <br><br>

    <select id="attendanceDay">
        <option value="4">DAY 1</option>
        <option value="5">DAY 2</option>
        <option value="6">DAY 3</option>
        <option value="7">DAY 4</option>
        <option value="8">DAY 5</option>
        <option value="9">DAY 6</option>
        <option value="10">DAY 7</option>
        <option value="11">DAY 8</option>
        <option value="12">DAY 9</option>
        <option value="13">DAY 10</option>
        <option value="14">DAY 11</option>
        <option value="15">DAY 12</option>
        <option value="16">DAY 13</option>
        <option value="17">DAY 14</option>
        <option value="18">DAY 15</option>
        <option value="19">DAY 16</option>
        <option value="20">DAY 17</option>
    </select>

    <br><br>

    <div id="reader"></div>

    <h3 id="status">
        Waiting for scan...
    </h3>

    <button onclick="checkAttendance()">
        CHECK ATTENDANCE
    </button>

    <div id="result"></div>

    <script src="script.js"></script>

</body>

</html>
