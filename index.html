<!DOCTYPE html>

<html>

<head>

<title>
TCC ROTC Attendance
</title>


<link rel="stylesheet" href="style.css">


<script src=
"https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


</head>


<body>



<!-- ADMIN LOGIN -->

<div id="login">


<h1>
ADMIN LOGIN
</h1>


<input 
type="text" 
id="username"
placeholder="Username">


<br><br>


<input 
type="password" 
id="password"
placeholder="Password">


<br><br>


<button onclick="login()">
LOGIN
</button>


<h3 id="loginStatus"></h3>


</div>







<!-- ATTENDANCE SYSTEM -->


<div id="attendance" style="display:none;">


<h1>
TCC ROTC UNIT
</h1>


<h2>
QR ATTENDANCE
</h2>


<div id="reader"></div>


<h3 id="status">
Waiting for scan...
</h3>



<button onclick="checkAttendance()">
CHECK ATTENDANCE
</button>



<button onclick="logout()">
LOGOUT
</button>



<div id="result"></div>



</div>





<script src="script.js"></script>


</body>

</html>
